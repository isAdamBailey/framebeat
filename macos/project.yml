name: FrameBeat
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

packages:
  FrameBeatCore:
    path: FrameBeatCore

# Explicit, so `xcodegen generate` reliably (re)writes both shared scheme
# files every run — relying on xcodegen's scheme autogeneration silently
# produced none at all for this project (empirically confirmed: an empty
# xcshareddata/xcschemes/ after generate), which once wiped a manually
# created FrameBeatiPad scheme that had been committed.
schemes:
  FrameBeat:
    build:
      targets:
        FrameBeat: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FrameBeatiPad:
    build:
      targets:
        FrameBeatiPad: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  FrameBeatiPad:
    type: application
    platform: iOS
    sources:
      - path: FrameBeat
        excludes:
          - "Resources/Fonts/**"
          - "Info.plist"
          - "FrameBeat.entitlements"
      - path: FrameBeat/Resources/Fonts
        type: folder
    dependencies:
      - package: FrameBeatCore
        product: FrameBeatCore
    settings:
      base:
        PRODUCT_NAME: FrameBeat
        # Same bundle ID as the macOS target so both can live under one
        # Universal Purchase app record in App Store Connect — confirm this
        # identifier is actually eligible for iOS in the developer portal
        # before archiving; if not, this needs its own identifier.
        PRODUCT_BUNDLE_IDENTIFIER: io.adambailey.framebeat
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FrameBeat/Info-iOS.plist
        DEVELOPMENT_TEAM: 883942B6M2
        # iPad only for this first pass — the current layout is a tall
        # portrait panel that needs real redesign work before it's usable
        # on iPhone's much narrower screen (tracked as separate follow-up).
        TARGETED_DEVICE_FAMILY: "2"
      configs:
        # Automatic signing makes xcodebuild resolve provisioning for the
        # *whole* scheme, including the Debug/Development-oriented actions,
        # even when archiving only needs Release — and this account has no
        # registered iOS devices (simulator-only), so that Development-side
        # resolution fails and blocks the Release archive too. Manual
        # signing for Release only, pointed at an explicitly-created App
        # Store distribution profile (which never needs devices), sidesteps
        # it entirely. Debug is left on automatic — fine since simulator
        # builds don't need any provisioning profile regardless.
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "FrameBeat iOS App Store"
    info:
      path: FrameBeat/Info-iOS.plist
      properties:
        CFBundleDisplayName: FrameBeat
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleInfoDictionaryVersion: "6.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 Adam Bailey"
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - "Fonts/fraunces-latin-soft-normal.ttf"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FrameBeat:
    type: application
    platform: macOS
    sources:
      - path: FrameBeat
        excludes:
          - "Resources/Fonts/**"
      - path: FrameBeat/Resources/Fonts
        type: folder
    dependencies:
      - package: FrameBeatCore
        product: FrameBeatCore
    settings:
      base:
        PRODUCT_NAME: FrameBeat
        PRODUCT_BUNDLE_IDENTIFIER: io.adambailey.framebeat
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FrameBeat/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrameBeat/FrameBeat.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 883942B6M2
        DEVELOPMENT_ASSET_PATHS: ""
    info:
      path: FrameBeat/Info.plist
      properties:
        CFBundleDisplayName: FrameBeat
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.music
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Adam Bailey"
        ITSAppUsesNonExemptEncryption: false
        ATSApplicationFontsPath: "Fonts/"
    entitlements:
      path: FrameBeat/FrameBeat.entitlements
      properties:
        com.apple.security.app-sandbox: true
