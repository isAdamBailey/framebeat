name: Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # The main ruleset requires this check by name; rename both together.
    name: Native (swift test + Mac and iPad builds)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A PR that changes the shared spec/ cases may add Swift tests, but
      # must not touch shipped Swift code (issue #16).
      - name: Scope check for spec/ changes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^spec/'; then
            outside=$(echo "$changed" | grep '^macos/' | grep -v '^macos/FrameBeatCore/Tests/' || true)
            if [ -n "$outside" ]; then
              echo "This PR changes spec/ and also macos/ outside macos/FrameBeatCore/Tests/:"
              echo "$outside"
              exit 1
            fi
          fi

      - name: Engine tests
        working-directory: macos/FrameBeatCore
        run: swift test

      - name: Engine tests (iPad simulator)
        working-directory: macos/FrameBeatCore
        run: |
          sim=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")], reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPad")))
          ')
          echo "iPad simulator: $sim"
          xcodebuild test -scheme FrameBeatCore-Package \
            -destination "platform=iOS Simulator,id=$sim" CODE_SIGNING_ALLOWED=NO

      - name: Engine self-check
        working-directory: macos/FrameBeatCore
        run: swift run frame-beat-selfcheck

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build FrameBeat (macOS)
        run: |
          xcodebuild -project FrameBeat.xcodeproj -scheme FrameBeat \
            -configuration Debug -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build FrameBeatiPad (iOS Simulator)
        run: |
          xcodebuild -project FrameBeat.xcodeproj -scheme FrameBeatiPad \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
